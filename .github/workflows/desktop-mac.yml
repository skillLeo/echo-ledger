# The Mac app (.dmg) cannot be built on Windows: this builds it on GitHub's macOS runners for Apple Silicon and
# Intel, on every v* tag, on demand, and whenever the desktop app changes. Each chip runs on its own real runner
# (macos-15 is Apple Silicon, macos-15-intel is Intel): all Rust and front-end tests, the build, then the built app's
# smoke test (--smoke-test, src-tauri/src/smoke.rs), which also runs from the .dmg on macOS 26. It is signed with the
# Developer ID certificate and notarized when the Apple secrets exist, and unsigned otherwise (the first open then goes
# through System Settings → Privacy & Security → Open Anyway, docs/USER_GUIDE.md); the updater's .app.tar.gz and .sig
# are made when the updater key's secret exists (docs/SIGNING.md). The .dmg files are the run's artifacts, and on a v*
# tag they are attached to that tag's GitHub Release.
name: Desktop (macOS)

on:
  push:
    # Branch pushes run only when the desktop app or this file changed (paths are not checked for tags).
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      # Secrets cannot be read in a step's `if`: only whether they are set is passed on. Notarizing needs all of them.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            label: Apple Silicon
            artifact: EchoLedger-mac-apple-silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            label: Intel
            artifact: EchoLedger-mac-intel
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: What this runner is
        run: |
          sw_vers
          echo "$(uname -m), $(sysctl -n machdep.cpu.brand_string)"
          echo "$(sw_vers -productVersion) on $(uname -m): tests, build and smoke test" >> "$GITHUB_STEP_SUMMARY"

      - name: Front end tests and types
        run: |
          npx vitest run --maxWorkers=2 --testTimeout=30000
          npx tsc --noEmit

      # The macOS-only code (Core Audio tap, Touch ID, bundle-id detection, the ScreenCaptureKit screen moments) is
      # compiled and checked only here. Native on both chips, so the tests run on the chip they are for.
      - name: Rust tests and clippy (macOS code)
        working-directory: desktop/src-tauri
        run: |
          cargo test --no-fail-fast --target ${{ matrix.target }}
          cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # The updater's package and .sig (docs/SIGNING.md): only with the updater key, never stored in the repo.
      - name: Turn on the signed updater package
        if: env.HAS_UPDATER_KEY == 'true'
        run: echo "UPDATER_CONFIG=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"

      # The identity is read from the certificate unless the secret names it (an empty variable would be used as is).
      - name: Name the signing identity
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

      - name: Build (unsigned)
        if: env.HAS_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles app,dmg ${{ env.UPDATER_CONFIG }}

      # The Tauri bundler imports the certificate into a temporary keychain, signs with the hardened runtime and
      # Entitlements.plist, sends the app to Apple's notary service and staples the ticket.
      - name: Build, sign and notarize
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles app,dmg ${{ env.UPDATER_CONFIG }}

      - name: Check the signature and the notarization
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          if [ "$HAS_APPLE_SIGNING" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 macos/EchoLedger.app
            spctl --assess --type execute --verbose=4 macos/EchoLedger.app
            xcrun stapler validate macos/EchoLedger.app
            echo "Signed with the Developer ID certificate and notarized." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unsigned build: no Apple signing secrets in this repository (docs/SIGNING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke test of the built app
        run: sh scripts/smoke-mac.sh src-tauri/target/${{ matrix.target }}/release/bundle/macos/EchoLedger.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  # The newest macOS GitHub offers, each chip: the .dmg a person downloads opens, and its app passes the smoke test.
  smoke:
    name: Smoke test, ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macOS 26 Apple Silicon
            artifact: EchoLedger-mac-apple-silicon
          - runner: macos-26-intel
            label: macOS 26 Intel
            artifact: EchoLedger-mac-intel
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/scripts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded

      - name: Open the .dmg and run the smoke test
        run: |
          sw_vers
          uname -m
          echo "$(sw_vers -productVersion) on $(uname -m): the .dmg's smoke test" >> "$GITHUB_STEP_SUMMARY"
          dmg=$(find downloaded -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/echoledger-dmg
          cp -R /tmp/echoledger-dmg/EchoLedger.app "$RUNNER_TEMP/EchoLedger.app"
          hdiutil detach /tmp/echoledger-dmg
          sh desktop/scripts/smoke-mac.sh "$RUNNER_TEMP/EchoLedger.app"

  # A v* tag's GitHub Release gets both .dmg files (the release is made when the tag has none yet). Nothing else in this
  # workflow can write to the repository.
  release:
    name: Attach the .dmg files to the release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EchoLedger-mac-*
          path: downloaded

      - name: Attach to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "EchoLedger $TAG" --notes "Desktop builds of $TAG." $prerelease
          find downloaded -name '*.dmg' -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "Attached to $TAG:" >> "$GITHUB_STEP_SUMMARY"
          find downloaded -name '*.dmg' -exec basename {} \; >> "$GITHUB_STEP_SUMMARY"
