# The Mac app (.dmg) cannot be built on Windows: this builds it on GitHub's macOS runners for Apple Silicon and
# Intel, on every v* tag, on demand, and whenever the desktop app changes. Each chip runs on its own real runner
# (macos-15 is Apple Silicon, macos-15-intel is Intel): all Rust and front-end tests, the build, then the built app's
# smoke test (--smoke-test, src-tauri/src/smoke.rs), which also runs from the .dmg on macOS 26. It is signed with the
# Developer ID certificate and notarized when the Apple secrets exist; until then, on main, v1.1 and v* tags, with the
# self-signed "EchoLedger Development Signing" identity when its secret exists, so macOS keeps the microphone, system
# audio, Screen Recording and the keychain items across updates; and ad hoc otherwise. Without the Developer ID the
# first open goes through System Settings → Privacy & Security → Open Anyway (docs/USER_GUIDE.md). The updater's
# .app.tar.gz is packed here, and the release shell signs it with the updater key, which stays out of GitHub
# (desktop/RELEASE.md, docs/SIGNING.md). The .dmg and .app.tar.gz files are the run's artifacts, and on a v* tag the
# .dmg files are attached to that tag's GitHub Release.
name: Desktop (macOS)

on:
  push:
    # Branch pushes run only when the desktop app or this file changed (paths are not checked for tags).
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'docs/api-samples/**'
      # The sharing-bar patterns the app is built with (privacy/bars.rs).
      - 'web/resources/data/share-bars.json'
      - '.github/workflows/desktop-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      # Secrets cannot be read in a step's `if`: only whether they are set is passed on. Notarizing needs all of them.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      # The self-signed identity (a base64 PKCS#12 and its password, docs/SIGNING.md), used only without the Apple ones.
      HAS_SELF_SIGNING: ${{ secrets.MACOS_SELF_SIGNED_P12 != '' && secrets.MACOS_SELF_SIGNED_P12_PASSWORD != '' }}
      # It signs only what can be released: main, v1.1 and v* tags. Any other branch builds ad hoc, so a build of a branch
      # never carries the identity every installed app's permissions are kept for. (The .p12 exists only in these
      # secrets, so they cannot move into an environment.)
      SIGNING_REF: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.1' || startsWith(github.ref, 'refs/tags/v') }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            label: Apple Silicon
            artifact: EchoLedger-mac-apple-silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            label: Intel
            artifact: EchoLedger-mac-intel
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: What this runner is
        run: |
          sw_vers
          echo "$(uname -m), $(sysctl -n machdep.cpu.brand_string)"
          echo "$(sw_vers -productVersion) on $(uname -m): tests, build and smoke test" >> "$GITHUB_STEP_SUMMARY"

      - name: Front end tests and types
        run: |
          npx vitest run --maxWorkers=2 --testTimeout=30000
          npx tsc --noEmit

      # The macOS-only code (Core Audio tap, Touch ID, bundle-id detection, the ScreenCaptureKit screen moments) is
      # compiled and checked only here. Native on both chips, so the tests run on the chip they are for.
      - name: Rust tests and clippy (macOS code)
        working-directory: desktop/src-tauri
        run: |
          cargo test --no-fail-fast --target ${{ matrix.target }}
          cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # The updater's package and .sig (docs/SIGNING.md): only with the updater key, never stored in the repo.
      - name: Turn on the signed updater package
        if: env.HAS_UPDATER_KEY == 'true'
        run: echo "UPDATER_CONFIG=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"

      # The identity is read from the certificate unless the secret names it (an empty variable would be used as is).
      - name: Name the signing identity
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

      # Until the Apple Developer ID exists (H9), one self-signed identity signs every build of main, v1.1 and v* tags.
      # macOS ties the microphone, system audio, Screen Recording and the keychain items to a signature's designated
      # requirement: an ad hoc build's names its own hash, so each update is a new app to macOS; this one's names the
      # certificate, so they stay. The identity lives in a temporary
      # keychain on the search list for this build only (the last step removes both); the bundler then signs with it,
      # the hardened runtime and Entitlements.plist, as on the Developer ID path. Nothing is notarized: there is no
      # Apple account behind it.
      - name: Import the self-signed identity
        if: env.HAS_APPLE_SIGNING != 'true' && env.HAS_SELF_SIGNING == 'true' && env.SIGNING_REF == 'true'
        env:
          P12: ${{ secrets.MACOS_SELF_SIGNED_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_P12_PASSWORD }}
        run: |
          set -eu
          kc="$RUNNER_TEMP/echoledger-signing.keychain-db"
          kc_password="$(openssl rand -hex 24)"
          security list-keychains -d user | tr -d '"' | awk '{ print $1 }' > "$RUNNER_TEMP/keychains-before"
          security create-keychain -p "$kc_password" "$kc"
          echo "SELF_SIGNED_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/self-signed.p12"
          security import "$RUNNER_TEMP/self-signed.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/self-signed.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$kc" > /dev/null
          identity=$(security find-identity -p codesigning "$kc" | awk '/"EchoLedger Development Signing"/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_SELF_SIGNED_P12 holds no code-signing identity named EchoLedger Development Signing (docs/SIGNING.md)."
            exit 1
          fi
          # On the search list for this build only, before the runner's own keychains. No trust setting anywhere: signing,
          # codesign --verify --strict and the designated requirement need none, and nothing system-wide is changed.
          security list-keychains -d user -s "$kc" $(cat "$RUNNER_TEMP/keychains-before")
          # The untrusted identity signs from the search list, with the hardened runtime, before the long build starts,
          # and the result verifies strictly.
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/probe.c"
          cc -o "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.c"
          codesign --force --sign "$identity" --options runtime "$RUNNER_TEMP/probe"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/probe"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SELF_SIGNED=true" >> "$GITHUB_ENV"

      - name: Build (self-signed on main, v1.1 and v* tags; ad hoc elsewhere or without that secret)
        if: env.HAS_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The server the sign-in uses (v1.6), built into the page by vite.config.ts; a repository variable, never in
          # the sources. Unset: the app asks for the server address.
          ECHOLEDGER_DEFAULT_SERVER: ${{ vars.ECHOLEDGER_DEFAULT_SERVER }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles app,dmg ${{ env.UPDATER_CONFIG }}

      # The Tauri bundler imports the certificate into a temporary keychain, signs with the hardened runtime and
      # Entitlements.plist, sends the app to Apple's notary service and staples the ticket.
      - name: Build, sign and notarize
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The server the sign-in uses (v1.6), built into the page by vite.config.ts; a repository variable, never in
          # the sources. Unset: the app asks for the server address.
          ECHOLEDGER_DEFAULT_SERVER: ${{ vars.ECHOLEDGER_DEFAULT_SERVER }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles app,dmg ${{ env.UPDATER_CONFIG }}

      # scripts/check-mac-signature.sh (the release shell runs the same before publishing): valid and strict, the hardened
      # runtime (codesign -dv: flags=...(runtime)), and entitlements that allow the microphone and Apple events
      # (codesign -d --entitlements - --xml), which "Read browser tab addresses" needs under the hardened runtime.
      - name: Check the signature and the notarization
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          # In the log, what the script checks: the flags (runtime) and the entitlements.
          codesign -dv macos/EchoLedger.app 2>&1 | grep -E '^(Identifier|CodeDirectory|Signature|TeamIdentifier)' || true
          codesign -d --entitlements - --xml macos/EchoLedger.app || true
          echo
          if [ "$HAS_APPLE_SIGNING" = "true" ]; then
            sh "$GITHUB_WORKSPACE/desktop/scripts/check-mac-signature.sh" macos/EchoLedger.app
            spctl --assess --type execute --verbose=4 macos/EchoLedger.app
            xcrun stapler validate macos/EchoLedger.app
            echo "Signed with the Developer ID certificate and notarized." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${SELF_SIGNED:-}" = "true" ]; then
            # What the permissions are kept for: this app from the pinned certificate, whichever build.
            sh "$GITHUB_WORKSPACE/desktop/scripts/check-mac-signature.sh" macos/EchoLedger.app --pinned
            echo "Signed with the self-signed identity and the hardened runtime; its designated requirement pins the certificate, so macOS keeps the permissions across updates. Not notarized." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_SELF_SIGNING" = "true" ]; then
            echo "Ad hoc build: the self-signed identity signs only main, v1.1 and v* tags (docs/SIGNING.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ad hoc build: no Apple signing secrets and no self-signed identity in this repository (docs/SIGNING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Without the updater key in GitHub (decided for v1.8.1), the updater package is packed here, as the bundler packs
      # it (EchoLedger.app at the archive's top, no macOS metadata), and the release shell signs it with the key
      # (desktop/RELEASE.md, scripts/release-mac.sh).
      - name: Pack the updater package for the release shell
        if: env.HAS_UPDATER_KEY != 'true'
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: COPYFILE_DISABLE=1 tar --no-mac-metadata -czf EchoLedger.app.tar.gz EchoLedger.app

      # Even after a failed build: the search list as it was and the temporary keychain deleted.
      - name: Remove the self-signed identity
        if: always() && env.SELF_SIGNED_KEYCHAIN != ''
        run: |
          if [ -s "$RUNNER_TEMP/keychains-before" ]; then security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before"); fi
          security delete-keychain "$SELF_SIGNED_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/self-signed.p12" "$RUNNER_TEMP/keychains-before" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.c"

      - name: Smoke test of the built app
        run: sh scripts/smoke-mac.sh src-tauri/target/${{ matrix.target }}/release/bundle/macos/EchoLedger.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  # The newest macOS GitHub offers, each chip: the .dmg a person downloads opens, and its app passes the smoke test.
  smoke:
    name: Smoke test, ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macOS 26 Apple Silicon
            artifact: EchoLedger-mac-apple-silicon
          - runner: macos-26-intel
            label: macOS 26 Intel
            artifact: EchoLedger-mac-intel
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/scripts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded

      - name: Open the .dmg and run the smoke test
        run: |
          sw_vers
          uname -m
          echo "$(sw_vers -productVersion) on $(uname -m): the .dmg's smoke test" >> "$GITHUB_STEP_SUMMARY"
          dmg=$(find downloaded -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/echoledger-dmg
          cp -R /tmp/echoledger-dmg/EchoLedger.app "$RUNNER_TEMP/EchoLedger.app"
          hdiutil detach /tmp/echoledger-dmg
          sh desktop/scripts/smoke-mac.sh "$RUNNER_TEMP/EchoLedger.app"

  # A v* tag's GitHub Release gets both .dmg files (the release is made when the tag has none yet). Nothing else in this
  # workflow can write to the repository.
  release:
    name: Attach the .dmg files to the release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EchoLedger-mac-*
          path: downloaded

      - name: Attach to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "EchoLedger $TAG" --notes "Desktop builds of $TAG." $prerelease
          find downloaded -name '*.dmg' -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "Attached to $TAG:" >> "$GITHUB_STEP_SUMMARY"
          find downloaded -name '*.dmg' -exec basename {} \; >> "$GITHUB_STEP_SUMMARY"
