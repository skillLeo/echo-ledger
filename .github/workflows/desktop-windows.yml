# Builds and checks the Windows desktop app on GitHub's Windows runners, so the Windows-only code (WASAPI capture,
# Windows Graphics Capture, Windows Hello, the installer) is compiled and tested even when the work happens on a Mac.
# The installer is signed when the code-signing certificate's secrets exist and unsigned otherwise; the updater's
# package and .sig are made when the updater key's secret exists (docs/SIGNING.md).
name: Desktop (Windows)

on:
  push:
    # Branch pushes run only when the desktop app or this file changed (paths are not checked for tags).
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    env:
      # Secrets cannot be read in a step's `if`: only whether they are set is passed on.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - name: Front end tests and types
        run: |
          npx vitest run --maxWorkers=2 --testTimeout=30000
          npx tsc --noEmit

      # The Windows-only code is compiled and checked only here (and on a Windows laptop).
      - name: Rust tests and clippy (Windows code)
        working-directory: desktop/src-tauri
        run: |
          cargo test --no-fail-fast
          cargo clippy --all-targets -- -D warnings

      # Authenticode: the certificate (a base64 .pfx) goes into this runner's user store for the build only, and the
      # Tauri bundler signs the app, the installer and the uninstaller with signtool by its thumbprint.
      - name: Import the code-signing certificate
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $timestamp } } }
          $file = Join-Path $env:RUNNER_TEMP 'tauri.signing.conf.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path $file -Encoding utf8NoBOM
          "SIGNING_CONFIG=--config $file" >> $env:GITHUB_ENV

      # The updater's package and .sig (docs/SIGNING.md): only with the updater key, never stored in the repo.
      - name: Turn on the signed updater package
        if: env.HAS_UPDATER_KEY == 'true'
        shell: pwsh
        run: '"UPDATER_CONFIG=--config src-tauri/tauri.release.conf.json" >> $env:GITHUB_ENV'

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --bundles nsis ${{ env.SIGNING_CONFIG }} ${{ env.UPDATER_CONFIG }}

      - name: Check the installer's signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($env:HAS_WINDOWS_CERTIFICATE -eq 'true') {
            if ($signature.Status -ne 'Valid') { throw "The installer is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
            "Signed by $($signature.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Unsigned build: no code-signing certificate in this repository's secrets (docs/SIGNING.md)." >> $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoLedger-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30
