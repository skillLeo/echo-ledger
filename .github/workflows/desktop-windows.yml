# Builds and checks the Windows desktop app on GitHub's Windows runners, so the Windows-only code (WASAPI capture,
# Windows Graphics Capture, Windows Hello, the installer) is compiled and tested even when the work happens on a Mac.
# The installer is unsigned until a code-signing certificate is set up (docs/SIGNING.md).
name: Desktop (Windows)

on:
  push:
    # Branch pushes run only when the desktop app or this file changed (paths are not checked for tags).
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - name: Front end tests and types
        run: |
          npx vitest run --maxWorkers=2 --testTimeout=30000
          npx tsc --noEmit

      # The Windows-only code is compiled and checked only here (and on a Windows laptop).
      - name: Rust tests and clippy (Windows code)
        working-directory: desktop/src-tauri
        run: |
          cargo test --no-fail-fast
          cargo clippy --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: EchoLedger-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
