[package]
name = "echoledger-desktop"
version = "1.6.0"
description = "EchoLedger desktop: live captions, dictation and dual-channel call capture"
authors = ["EchoLedger"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Versions pinned in lockstep with the npm packages (docs/research/desktop-tauri.md §1).
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
# Signed updates (v1.5) from the signed-in server's /downloads/desktop.json; driven from Rust only (no JS half). Its own
# TLS goes through the server's pins (configure_client); no zip (the NSIS installer is used as is) and no system proxy,
# like the app's own client.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "sync", "rt-multi-thread", "fs"] }
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = "0.103.16"
webpki-roots = "1.0.11"
ring = "0.17.14"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
keyring = "4.2.0"
enigo = "0.6.1"
base64 = "0.23.1"
hound = "3.5.1"
flacenc = "0.5.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Screen moments (v1.5) are stored as lossy WebP: libwebp built in by libwebp-sys (no image crate).
webp = { version = "0.3.1", default-features = false }
# Screen-share privacy (v1.8.1): the sharing-bar patterns (regular expressions shared with the server) and meeting
# apps' versions from their Info.plist (both already in the tree through Tauri).
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
plist = "1.10.3"
# Your account (contract 2.0.0-l): a profile picture in another format is turned into a JPEG here before upload (the
# image crate is already in the tree through Tauri), and two-step sign-in's QR code is drawn from its otpauth link.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff"] }
qrcodegen = "1.8.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The native open and save dialogs, used from the core only (the webview never picks a path). Not through
# tauri-plugin-dialog: its page script swaps window.confirm for an asynchronous one, which every "Delete?" relies on.
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
wasapi = "0.26.0"
windows = { version = "0.62.2", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  # Interrupt time with and without sleep (`audio::sleep`).
  "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_System_Threading",
  # The smoke test: whether this process runs in an interactive session (`privacy::win::session_id`).
  "Win32_System_RemoteDesktop",
  "Win32_System_Diagnostics_ToolHelp",
  # The smoke test's stall report: a minidump of every thread (`stall`).
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  # An endpoint's property store (the Bluetooth check reads its device instance id); wasapi enables these as well.
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Security_Credentials_UI",
  "Foundation",
  "UI",
  "UI_ViewManagement",
  # Screen moments (v1.5): Windows.Graphics.Capture of the meeting window or a monitor, read back through a D3D11
  # staging texture; the borderless request, the window's cloaked state and its monitor.
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  # Send to WhatsApp → Text and voice (F6): the Share window with the text and the voice file, and the file on the
  # clipboard (CF_HDROP) when WhatsApp is not there.
  "ApplicationModel_DataTransfer",
  "Storage",
  "Storage_Streams",
  "Foundation_Collections",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
] }
windows-future = "0.3.2"
# The share's list of files (IIterable<IStorageItem>): the windows crate takes it from here and does not re-export it.
# Already in the tree through windows 0.62.
windows-collections = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSValue", "NSUUID", "NSString", "NSError", "NSProcessInfo", "NSGeometry", "NSURL", "NSNotification", "NSOperation", "NSDictionary", "block2"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFDictionary", "CFArray", "CFNumber", "CFData", "CFCGTypes", "CFUUID"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }
# AppKit for the overlays' level and Spaces, the displays' usable areas, the Mac check's installed apps and the system's
# own windows in this process (NSApplication's window list, left out of screen share with EchoLedger's), the Dock icon
# while another app is full screen (spaces.rs; already in the tree through tao and wry); WhatsApp's share and the
# pasteboard for Send to WhatsApp → Text and voice (share_sheet).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace", "NSGraphics", "block2", "NSSharingService", "NSPasteboard"] }
# Screen moments (v1.5): screenshots of the meeting window or display, and the Screen Recording permission.
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "CGWindow", "CGColorSpace"] }

[dev-dependencies]
tempfile = "3"
# Independent FLAC decoder used to verify what the encoder writes.
claxon = "0.4"
# Throw-away certificate chains for the SPKI pinning tests.
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
# The main-thread rule (main_thread.rs) reads the crate's own sources: no lock is held while waiting for the main
# thread. Already in the tree through Tauri's macros; `span-locations` gives the lines it names.
syn = { version = "2.0.119", features = ["full", "visit"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

# tests/mac_appkit.rs builds tao's own window and app delegate (the version and features Tauri uses, nothing new built).
[target.'cfg(target_os = "macos")'.dev-dependencies]
# This dev pin also fixes the app's own tao (Cargo resolves one 0.37.x). On a Tauri/tao bump, re-run
# tests/mac_appkit.rs and the Mac smoke test (the floating panels' class switch checks tao's window shape) first.
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }

# AppKit on the main thread: the floating windows become panels, the delegate answers quits from outside (macOS).
[[test]]
name = "mac_appkit"
harness = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
