[package]
name = "echoledger-desktop"
version = "1.1.0"
description = "EchoLedger desktop: live captions, dictation and dual-channel call capture"
authors = ["EchoLedger"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Versions pinned in lockstep with the npm packages (docs/research/desktop-tauri.md §1).
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "sync", "rt-multi-thread", "fs"] }
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = "0.103.16"
webpki-roots = "1.0.11"
ring = "0.17.14"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
keyring = "4.2.0"
enigo = "0.6.1"
base64 = "0.23.1"
hound = "3.5.1"
flacenc = "0.5.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows = { version = "0.62.2", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSValue", "NSUUID", "NSString"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFDictionary", "CFArray", "CFNumber"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"

[dev-dependencies]
tempfile = "3"
# Independent FLAC decoder used to verify what the encoder writes.
claxon = "0.4"
# Throw-away certificate chains for the SPKI pinning tests.
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
