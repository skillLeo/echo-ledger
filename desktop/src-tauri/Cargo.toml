[package]
name = "echoledger-desktop"
version = "1.5.0-beta.1"
description = "EchoLedger desktop: live captions, dictation and dual-channel call capture"
authors = ["EchoLedger"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Versions pinned in lockstep with the npm packages (docs/research/desktop-tauri.md §1).
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "sync", "rt-multi-thread", "fs"] }
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = "0.103.16"
webpki-roots = "1.0.11"
ring = "0.17.14"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
keyring = "4.2.0"
enigo = "0.6.1"
base64 = "0.23.1"
hound = "3.5.1"
flacenc = "0.5.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Screen moments (v1.5) are stored as lossy WebP: libwebp built in by libwebp-sys (no image crate).
webp = { version = "0.3.1", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The native open and save dialogs, used from the core only (the webview never picks a path). Not through
# tauri-plugin-dialog: its page script swaps window.confirm for an asynchronous one, which every "Delete?" relies on.
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows = { version = "0.62.2", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
    "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  # An endpoint's property store (the Bluetooth check reads its device instance id); wasapi enables these as well.
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Security_Credentials_UI",
  "Foundation",
  "UI",
  "UI_ViewManagement",
  # Screen moments (v1.5): Windows.Graphics.Capture of the meeting window or a monitor, read back through a D3D11
  # staging texture; the borderless request, the window's cloaked state and its monitor.
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }
windows-future = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSValue", "NSUUID", "NSString", "NSError"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFDictionary", "CFArray", "CFNumber", "CFData", "CFCGTypes"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }
# Screen moments (v1.5): screenshots of the meeting window or display, and the Screen Recording permission.
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "CGWindow"] }

[dev-dependencies]
tempfile = "3"
# Independent FLAC decoder used to verify what the encoder writes.
claxon = "0.4"
# Throw-away certificate chains for the SPKI pinning tests.
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
